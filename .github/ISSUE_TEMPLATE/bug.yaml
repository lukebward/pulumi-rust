name: Bug Report
description: Report something that's not working correctly
labels: ["kind/bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
        You can also ask questions on our [Community Slack](https://slack.pulumi.com/).
  - type: textarea
    id: what-happened
    attributes:
      label: Describe what happened
      description: Please summarize what happened, including what Pulumi commands you ran, as well as
        an inline snippet of any relevant error or console output.
    validations:
      required: true
  - type: textarea
    id: sample-program
    attributes:
      label: Sample program
      description: |
        Please provide a minimal, self-contained Pulumi Rust program that reproduces this behavior.
        Without a functional reproduction, we will not be able to prioritize this bug.
        **Note:** If the program is more than a few lines, please send us a Gist or a link to a file.
    validations:
      required: true
  - type: textarea
    id: log-output
    attributes:
      label: Log output
      description: |
        If this depends on your environment, please also provide the output of
        `pulumi up --logtostderr --logflow -v=10` from the root of your project.
        **Note:** If the log output is more than a few lines, please send us a Gist or a link to a file.
  - type: textarea
    id: versions
    attributes:
      label: Output of `pulumi about`
      description: Provide the output of `pulumi about` from the root of your project.
    validations:
      required: true
  - type: textarea
    id: ctx
    attributes:
      label: Additional context
      description: Anything else you would like to add?
    validations:
      required: false
  - type: textarea
    id: voting
    attributes:
      label: Contributing
      value: |
        Vote on this issue by adding a 👍 reaction.
        To contribute a fix for this issue, leave a comment (and link to your pull request, if you've opened one already).
