name: Release

# Releases are cut from the changelog, not from a tag push: changie assembles
# CHANGELOG.md from the fragments in .changes, and landing that file on main is
# the signal. GoReleaser creates the tag itself. This is what pulumi-dotnet,
# pulumi-java, pulumi-yaml and pulumi-hcl all do, and it means the version in
# the changelog and the version on the tag cannot disagree.
on:
  push:
    branches: [main]
    paths:
      - CHANGELOG.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A release must not be cut from a red tree. Reusing ci.yml rather than
  # duplicating its jobs is why ci.yml carries a workflow_call trigger.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # The tag and the GitHub release are both created here.
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      released: ${{ steps.guard.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser needs full history, and the tag guard below needs the
          # tags themselves — neither of which a shallow default checkout has.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: pulumi-language-rust/go.mod
          cache-dependency-path: "**/go.sum"
      - uses: jdx/mise-action@v3
        with:
          version: 2025.1.9

      - name: Resolve the version from the changelog
        id: version
        run: |
          version="$(changie latest)"
          echo "changie latest -> '${version}'"
          echo "tag=${version}" >> "$GITHUB_OUTPUT"
          echo "notes=.changes/${version}.md" >> "$GITHUB_OUTPUT"

      # Decide whether there is anything to release, and end green when there
      # is not. Three ways there is nothing to do, all of them normal:
      #   - v0.0.0 is what changie prints when it has never batched a version,
      #     which is the state of this repository until the first release. It
      #     is a sentinel, not a version: changie exits 0 and prints it rather
      #     than printing nothing, so an empty-string check never fires.
      #   - no notes file for the resolved version, i.e. CHANGELOG.md moved
      #     without changie having batched.
      #   - the tag already exists, i.e. this push was a touch-up to a
      #     changelog that has already shipped.
      - name: Decide whether to release
        id: guard
        run: |
          version='${{ steps.version.outputs.tag }}'
          notes='${{ steps.version.outputs.notes }}'
          if [ -z "$version" ] || [ "$version" = "v0.0.0" ]; then
            echo "no batched version yet — nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [ ! -f "$notes" ]; then
            echo "no $notes — did changie batch/merge run? nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$(git tag -l "$version")" ]; then
            echo "$version is already tagged — nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "releasing $version"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      # GoReleaser does not create the tag; its git pipe requires HEAD to be
      # tagged already and aborts otherwise. Nothing else in this workflow
      # tagged it, so it has to happen here — before GoReleaser runs, and
      # after the guard has established the tag does not already exist.
      - name: Tag the release
        if: steps.guard.outputs.release == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a '${{ steps.version.outputs.tag }}' -m 'Release ${{ steps.version.outputs.tag }}'
          git push origin '${{ steps.version.outputs.tag }}'

      - uses: goreleaser/goreleaser-action@v6
        if: steps.guard.outputs.release == 'true'
        with:
          version: latest
          args: release --clean --release-notes=${{ steps.version.outputs.notes }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.tag }}

  # Publishing the `pulumi` crate is deliberately gated on the repository
  # variable PUBLISH_CRATE being "true", because it cannot work until someone
  # has configured crates.io trusted publishing for this repository. The crate
  # name is already registered to the Pulumi organisation, so this is an
  # organisation-side setup step, not something a workflow can bootstrap.
  # Until then a release publishes plugin binaries only, and this job is
  # skipped rather than failing every release.
  crate:
    name: Publish the pulumi crate
    needs: release
    if: vars.PUBLISH_CRATE == 'true' && needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Required to mint the short-lived crates.io token via OIDC.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # The crate version is not derived from the tag; it is a literal in
      # Cargo.toml that the release commit has to bump (see CONTRIBUTING.md).
      # Fail loudly when the two disagree rather than publishing something
      # mislabelled or silently skipping: a drifted manifest would otherwise
      # make every release after the first quietly stop publishing the crate,
      # since the probe below would keep finding the already-published
      # version.
      - name: Check the crate version matches the release
        run: |
          manifest="$(grep -m1 '^version = ' sdk/rust/pulumi/Cargo.toml | cut -d'"' -f2)"
          tag='${{ needs.release.outputs.tag }}'
          if [ "$manifest" != "${tag#v}" ]; then
            echo "sdk/rust/pulumi/Cargo.toml is at $manifest but the release is $tag." >&2
            echo "Bump the crate version (and refresh Cargo.lock) in the release commit." >&2
            exit 1
          fi

      # crates.io rejects requests without a User-Agent. Publishing the same
      # version twice is an error, so check first and skip if it is already up.
      - name: Skip if this version is already published
        id: published
        run: |
          version="$(grep -m1 '^version = ' sdk/rust/pulumi/Cargo.toml | cut -d'"' -f2)"
          code="$(curl -s -o /dev/null -w '%{http_code}' \
            -A 'pulumi-rust-release-workflow' \
            "https://crates.io/api/v1/crates/pulumi/${version}")"
          echo "pulumi ${version} -> HTTP ${code}"
          if [ "$code" = "200" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.published.outputs.publish == 'true'
        id: auth

      # The token goes in the environment, never on the command line: an
      # argument is visible in the process table and in any shell trace.
      - name: cargo publish
        if: steps.published.outputs.publish == 'true'
        working-directory: sdk/rust/pulumi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
