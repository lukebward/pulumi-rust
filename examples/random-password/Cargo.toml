[package]
name = "random-password"
version = "0.1.0"
edition = "2021"

[dependencies]
pulumi = { path = "../../sdk/rust/pulumi" }
# Generate this SDK before building. `gen-sdk` writes to <out>/<language>,
# so the crate lands in ./sdks/random/rust, which is what the path below
# points at. Remove any existing ./sdks first: a layout left over from an
# earlier run leaves this path unresolved.
#   rm -rf ./sdks
#   pulumi package gen-sdk random@4.18.4 --language rust --out ./sdks/random
# Then repoint the generated crate's own `pulumi` dependency, which is
# declared as `pulumi = "0.1"` and is not published:
#   in ./sdks/random/rust/Cargo.toml
#   pulumi = { path = "../../../../../sdk/rust/pulumi" }
pulumi_random = { path = "./sdks/random/rust" }

# Keep the generated SDK out of this workspace: each generated crate
# declares its own [workspace], and a path dependency of a workspace root
# would otherwise be adopted as a member.
[workspace]
exclude = ["sdks"]
