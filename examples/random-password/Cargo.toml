[package]
name = "random-password"
version = "0.1.0"
edition = "2021"

[dependencies]
pulumi = { path = "../../sdk/rust/pulumi" }
# Generate this SDK first:
#   pulumi package gen-sdk random@4.18.4 --language rust --out ./sdks/random
pulumi_random = { path = "./sdks/random/rust" }

# Keep the generated SDK out of this workspace: each generated crate
# declares its own [workspace], and a path dependency of a workspace root
# would otherwise be adopted as a member.
[workspace]
exclude = ["sdks"]
