[package]
name = "azure-rs-functions"
version = "0.1.0"
edition = "2021"

[dependencies]
pulumi = { path = "../../sdk/rust/pulumi" }
# Generate this SDK before building:
#   pulumi package gen-sdk azure-native@3.25.0 --language rust --out ./sdks/azure-native
# `gen-sdk` writes to <out>/<language>, so the crate lands in
# ./sdks/azure-native/rust — which is what the path below points at.
pulumi_azure_native = { path = "./sdks/azure-native/rust" }

# Standalone crate: never adopt an enclosing workspace. `gen-sdk` writes a
# crate that declares `[workspace]` itself, so the generated SDK has to be
# excluded from this one — otherwise cargo reports two workspace roots.
[workspace]
exclude = ["sdks"]
