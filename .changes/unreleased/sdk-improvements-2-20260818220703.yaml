kind: improvements
body: Add the Automation API (`pulumi::auto`), driving deployments from Rust code
  with the `pulumi` CLI underneath. `LocalWorkspace` and `Stack` cover the stack
  lifecycle, configuration, up/preview/refresh/destroy with typed results, stack
  outputs with secret marking, history, state export/import, and structured engine
  events. Programs can be Pulumi projects on disk in any language, or inline Rust
  closures served to the engine from an in-process language host.
